<!doctype html>
<html lang="en" style="overflow: hidden; height: 100%; overscroll-behavior: none">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png" />
		<title>Dumpster Duke</title>
		<!-- start downloading the Stake Engine intro first, before the game script and assets -->
		<link rel="preload" href="%sveltekit.assets%/stake-engine-loader.webp" as="image" type="image/webp" fetchpriority="high" />
		<meta name="viewport" content="width=device-width" />
		%sveltekit.head%
	</head>
	<body style="margin: 0; padding: 0; overflow: hidden; height: 100%; overscroll-behavior: none; background-color: black">
		<!--
			Stake Engine's intro, in plain HTML so it shows while the game script is still
			downloading. routes/+layout.svelte fades it out 2 s (one play of the animation)
			after the image has loaded, like the web-sdk's LoaderStakeEngine.
		-->
		<div
			id="stake-engine-intro"
			style="position: fixed; inset: 0; z-index: 999; display: flex; align-items: center; justify-content: center; background-color: #041721; transition: opacity 0.4s"
		>
			<img
				src="%sveltekit.assets%/stake-engine-loader.webp"
				alt="Powered by Stake Engine"
				draggable="false"
				style="width: 100%; max-width: 400px"
			/>
		</div>
		<div>%sveltekit.body%</div>
	</body>
</html>
